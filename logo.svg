<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Liquid Luxury Gold Gradient -->
    <linearGradient id="boldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#F2D180" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9C6E19" />
    </linearGradient>

    <filter id="boldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 100% TRANSPARENT BACKGROUND (NO BOX / NO RECT) -->
  <g transform="translate(256, 245)" filter="url(#boldShadow)">
    <!-- Bold Push Handle (24px) -->
    <path d="M -120 -95 L -75 -95 L -52 -25" 
          fill="none" 
          stroke="url(#boldGold)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Bold Inverted Droplet Cart Basket (24px) -->
    <path d="M 0 100 
             C -45 45, -95 0, -95 -55 
             C -95 -110, -50 -140, 5 -140 
             C 60 -140, 105 -110, 105 -55 
             C 105 0, 55 45, 0 100 Z" 
          fill="none" 
          stroke="url(#boldGold)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          transform="translate(15, 10)" />

    <!-- Bold Interior Shelf (18px) -->
    <line x1="-32" y1="-45" x2="68" y2="-45" stroke="url(#boldGold)" stroke-width="18" stroke-linecap="round" />

    <!-- Bold Lower Chassis (20px) -->
    <line x1="-38" y1="110" x2="62" y2="110" stroke="url(#boldGold)" stroke-width="20" stroke-linecap="round" />

    <!-- Bold Heavy Wheels (18px stroke) -->
    <circle cx="-35" cy="146" r="20" fill="none" stroke="url(#boldGold)" stroke-width="16" />
    <circle cx="-35" cy="146" r="6" fill="url(#boldGold)" />

    <circle cx="55" cy="146" r="20" fill="none" stroke="url(#boldGold)" stroke-width="16" />
    <circle cx="55" cy="146" r="6" fill="url(#boldGold)" />
  </g>
</svg>